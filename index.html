<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign-up form</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <div class="banner-container">
            <img class="hero-banner" src="img/hero-banner.avif" alt="Photo of plants">
            <div class="banner-card">
                <img class="banner-logo" src="img/odin-lined.png" alt="Odin image">
                <h1 class="banner-logo-text">ODIN</h1>
            </div>
            <p class="banner-footer">Photo by <a href="https://unsplash.com/@haliewestphoto">Halie West</a> on <a href="https://unsplash.com/photos/green-leaf-plant-in-close-up-photography-25xggax4bSA">Unsplash</a></p>
        </div>

        <div class="right-side">
            <h1 class="hero-text">This is not a real online service! You know you need something like this in your life to help you realize your deepest dreams. Sign up <em>now</em> to get started.</h1>
            <h1 class="sub-text">You <em>know</em> you want to.</h1>

            <form action="">
                <div class="form-body">
                    <h1 class="form-title">Let's do this!</h1>
                    <div class="form-container">
                        <div class="form-left">
                            <div class="form-group">
                                <label for="first-name">FIRST NAME *</label>
                                <input type="text" id="first-name" name="first-name" tabindex="1" required>
                            </div>

                            <div class="form-group">
                                <label for="email">EMAIL *</label>
                                <input type="email" id="email" name="email" tabindex="3" required>
                            </div>
                            
                            <div class="form-group">
                                <label for="password">PASSWORD *</label>
                                <input type="password" id="password" name="password" tabindex="5" required minlength="8" pattern="(?=.*[a-z])(?=.*[A-Z])(?=.*\d)(?=.*[\W_])(?!.*\s).{8,}" title="Must contain at least one number, one uppercase and lowercase letter, one special character, no spaces, and be at least 8 characters long.">
                            </div>
                        </div>
                    
                        <div class="form-right">
                            <div class="form-group">
                                <label for="last-name">LAST NAME *</label>
                                <input type="text" id="last-name" name="last-name" tabindex="2" required>
                            </div>

                            <div class="form-group">
                                <label for="phone">PHONE NUMBER *</label>
                                <input type="tel" id="phone" name="phone" tabindex="4" required>
                            </div>

                            <div class="form-group">
                                <label for="confirm-password">CONFIRM PASSWORD *</label>
                                <input type="password" id="confirm-password" name="confirm-password" tabindex="6" required minlength="8" pattern="(?=.*[a-z])(?=.*[A-Z])(?=.*\d)(?=.*[\W_])(?!.*\s).{8,}">
                            </div> 
                        </div>
                    </div>
                </div>
                <button type="submit">Create Account</button>
            </form>
            <p class="login">Already have an account? <a href="">Log in</a></p>
        </div>
    </div>
</body>
</html>
