<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign-up form</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <div class="banner-container">
            <img class="hero-banner" src="img/hero-banner.avif" alt="Photo of plants">
            <div class="banner-card">
                <img class="banner-logo" src="img/odin-lined.png" alt="Odin image">
                <h1 class="banner-logo-text">ODIN</h1>
            </div>
            <p class="banner-footer">Photo by ...</p>
        </div>

        <div class="right-side">
            <h1 class="hero-text">This is not a real online service! You know you need something like this in your life to help you realize your deepest dreams. Sign up <em>now</em> to get started.</h1>
            <h1>You <em>know</em> you want to.</h1>

            <form action="">
                <fieldset>
                    <h1>Let's do this!</h1>
                    <label for="first-name">FIRST NAME</label>
                    <input type="text" id="first-name" name="first-name">
                    <label for="last-name">LAST NAME</label>
                    <input type="text" id="last-name" name="last-name">
                    <label for="email">EMAIL</label>
                    <input type="email" id="email" name="email">
                    <label for="phone-number">PHONE NUMBER</label>
                    <input type="text" id="phone-number" name="phone-number">
                    <label for="password">PASSWORD</label>
                    <input type="text" id="password" name="password">
                    <label for="confirm-password">CONFIRM PASSWORD</label>
                    <input type="text" id="confirm-password" name="confirm-password">
                </fieldset>
            </form>
            <button>Create Account</button>
            <p class="login">Already have an account? <a href="">Log in</a></p>
        </div>
    </div>
</body>
</html>
